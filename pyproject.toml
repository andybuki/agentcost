[project]
name = "agentcost"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
agentcost = "agentcost.report:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentcost"]

[tool.setuptools.package-data]
agentcost = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
