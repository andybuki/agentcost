[project]
name = "agentcost"
version = "0.1.0"
requires-python = ">=3.11"
description = "Per-client cost of AI coding agent work, local-first, metadata only"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Andrey Buchmann" }]

[project.scripts]
agentcost = "agentcost.report:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentcost"]

[tool.setuptools.package-data]
agentcost = ["static/*", "prices.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
