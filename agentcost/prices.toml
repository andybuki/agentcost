# Built-in price list: Anthropic first-party API list prices, USD per million tokens.
# Checked 2026-10. clients.toml can override any entry or add models ([prices."id"]).
#
# Matching is by longest prefix of the model id, so "claude-opus-4-1" also covers
# "claude-opus-4-1-20250805". Unknown models stay unpriced (shown with a warning)
# rather than guessed.
#
# cache_write is the 5-minute cache write (1.25x input). Claude Code mostly writes
# 1-hour cache entries (2x input); agentcost does not split those yet (see PLAN.md).
# cache_read is 0.1x input, except where the provider prices it differently.

# --- current models ---------------------------------------------------------
