# agentcost configuration
#
# Example configuration with three demo clients for the sample data
# (python gen_sample.py). For your own data run: python -m agentcost init
currency_symbol = "EUR"
currency_rate = 0.92       # USD -> EUR
default_markup = 1.0       # billable = cost * markup
timezone = "Europe/Berlin" # days and months are counted in this time zone

# Optional: flat-rate plan. Uncomment and fill in your real plan; the web view
# then shows the fee next to the API-equivalent cost.
# [subscription]
# name = "Claude Max"
# monthly_fee = 180.0      # in currency_symbol
# since = 2026-05-01       # optional: no fee counted before this date

# Prices: a built-in list covers Claude models (agentcost/prices.toml).
# Override a model or add another one here (USD per million tokens):
# [prices."claude-opus-5-5"]
# input = 4.0
# output = 20.0
# cache_write = 5.0
# cache_read = 0.2

# Attribution rules: regex on working directory and/or git branch.
# Branch rules win over directory rules (useful for shared monorepos).
# Paths always use "/" — Windows paths are converted, so
# cwd = ["/IdeaProjects/acme-"] also matches C:\Users\me\IdeaProjects\acme-shop.
[[client]]
name = "Acme GmbH"
cwd = ["/projects/acme-"]
branch = ["^acme/"]
markup = 1.3

[[client]]
name = "Stadtwerke Nord"
cwd = ["/projects/swn-"]
markup = 1.2
min_fee = 25     # monthly report bills at least this much

[[client]]
name = "Internal"
cwd = ["/projects/internal", "/dotfiles"]
markup = 0
